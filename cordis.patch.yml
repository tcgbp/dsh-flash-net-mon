# dsh-flash-net-mon bundle layer — registers the HOST half into a profile.
#
# The BROWSER half needs no row here: the module loader auto-discovers the
# client bundle from package.json `exports["./client"]` + `dsh.client` and
# serves it at /plugins/<pkg>/client.js.
#
# PITFALL: `name` is a PACKAGE NAME (resolved via the profile's node_modules),
# NOT a relative path.
- insert:
    - id: dsh-flash-net-mon
      name: dsh-flash-net-mon
