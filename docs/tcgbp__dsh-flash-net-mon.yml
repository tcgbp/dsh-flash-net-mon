url: https://github.com/tcgbp/dsh-flash-net-mon
name: tcgbp/dsh-flash-net-mon
category: security
description:
  en: 'Network monitor, outbound-request audit and alert provider for dock-flash: registers a connectivity heartbeat and an audit alert provider plus its own quick-control switch through the quickControl and dockFlashAlerts services, and, while the audit is enabled, wraps global fetch to record metadata-only outbound requests (method, host, path, byte counts, status, duration, TLS) with a 0-100 risk score, configurable warn and danger thresholds, host and plugin allowlists, and a paged audit panel with a request stream, an alert view and whitelist management.'
  zh: 'dock-flash 的网络监控与出站审计插件：通过 quickControl 与 dockFlashAlerts 服务注册连通性心跳告警提供者、审计告警提供者和自己的快捷开关；启用审计后包装全局 fetch，只记录元数据（方法、主机、路径、字节数、状态、耗时、是否 TLS）并给出 0–100 风险分，支持可配置的可疑与危险阈值、主机与插件白名单，以及带分页的审计面板（请求流、告警、白名单管理）。'
tarball: https://github.com/tcgbp/dsh-flash-net-mon/releases/latest/download/dsh-flash-net-mon.tgz
