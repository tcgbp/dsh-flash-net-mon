#
# Category: `security`. The entry is about outbound requests — an audit trail,
# a risk score, and allowlists that suppress it. The same code also registers
# two providers into dock-flash's alert registry, which is `notify`'s subject;
# the registry treats a near-miss category as maintenance, not a rejection, so
# `security` is the closest one rather than a claim.
#
# The tarball is deliberately the version-free releases/latest/download/ URL
# with a version-free asset name. `latest` is resolved per request but the
# filename is taken literally, so an asset named dsh-flash-net-mon-<version>.tgz
# would 404 on the next release: keep the asset named dsh-flash-net-mon.tgz and
# publishing a new Release moves this URL by itself, with no entry edit and no
# pull request per release.
#
# Submission state, checked 2026-10-04 through api.github.com:
