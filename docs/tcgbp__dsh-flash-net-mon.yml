#       1. create the empty GitHub repo and bootstrap the mirror
#          (.github/workflows/sync-from-gitee.yml; steps in docs/releasing.md)
#       2. add the `dsh-plugin` topic to it (contributing.md requires it)
#       3. cut a Release carrying dsh-flash-net-mon.tgz, so the tarball URL works
