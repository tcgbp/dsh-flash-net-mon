name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 Tag（例如 v1.0.0）'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC 发布必需

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 1. 先安装 pnpm（必须在 setup-node 之前，否则 cache: 'pnpm' 无法工作）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9   # 若 package.json 有 packageManager 字段，可删掉这行让它自动读取

      # 2. 设置 Node.js 并启用 pnpm 缓存
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # 3. 用 pnpm 安装依赖（--frozen-lockfile 等价于 npm ci）
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package (if applicable)
        run: pnpm run build --if-present

      - name: Run tests
        run: pnpm test

      # 4. 用 pnpm 发布，OIDC 会自动生效
      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks --provenance
