name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'  # 仅当推送类似 v1.0.0 的标签时触发
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 Tag（例如 v1.0.0）'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # 必需，用于生成 OIDC 令牌

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }} # 手动触发时使用输入的 tag，自动触发时使用 github.ref

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'  # 必须 ≥ 22.14.0
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build package (if applicable)
        run: npm run build --if-present

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish --access public
        # 无需设置 NODE_AUTH_TOKEN，npm 会自动使用 OIDC
